services:
  - type: web
    name: tamil-kids-ai-backend
    env: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-app.vercel.app,http://localhost:5173
      - key: DATABASE_URL
        sync: false   # paste your Neon/Supabase Postgres URL in the Render dashboard
      - key: VIDEO_WIDTH
        value: "640"
      - key: VIDEO_HEIGHT
        value: "360"
      - key: VIDEO_FPS
        value: "15"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: DAILY_PUBLISH_TIME
        value: "09:00"
      - key: TIMEZONE
        value: "Asia/Kolkata"
      - key: AUTO_PUBLISH_ENABLED
        value: "false"
      - key: REQUIRE_MANUAL_APPROVAL
        value: "true"
